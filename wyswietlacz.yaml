esphome:
  name: wyswietlacz
  friendly_name: wyswietlacz
  on_boot:
    priority: 800
    then:
      - output.turn_on: lcd_bl

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret wyswietlacz_api_key

ota:
  - platform: esphome
    password: !secret wyswietlacz_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wyswietlacz Fallback Hotspot"
    password: !secret wyswietlacz_ap_password

captive_portal:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

output:
  - platform: gpio
    pin: GPIO27
    id: lcd_bl

time:
  - platform: homeassistant
    id: ha_time

image:
  - file: https://raw.githubusercontent.com/voltronicpl/wyswietlacz/main/images/tlo.png
    id: tlo
    type: RGB565

font:
  - file: "gfonts://Roboto@700"
    id: b20
    size: 20
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: b16
    size: 16
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: b14
    size: 14
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@700"
    id: b11
    size: 11
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Roboto@500"
    id: m10
    size: 10
    glyphsets: [GF_Latin_Core]

sensor:
  # ---- moc ----
  - { platform: homeassistant, id: pv1,  entity_id: sensor.modbus_falownik_pv1_moc, internal: true }
  - { platform: homeassistant, id: pv2,  entity_id: sensor.modbus_falownik_pv2_moc, internal: true }
  - { platform: homeassistant, id: load, entity_id: sensor.modbus_falownik_obciazenie_moc_suma, internal: true }
  - { platform: homeassistant, id: grid, entity_id: sensor.modbus_falownik_siec_moc_suma, internal: true }
  - { platform: homeassistant, id: bat,  entity_id: sensor.modbus_falownik_bateria_moc, internal: true }
  - { platform: homeassistant, id: soc,  entity_id: sensor.modbus_falownik_bateria_soc, internal: true }
  # ---- liczniki dzisiaj ----
  - { platform: homeassistant, id: e_pv,  entity_id: sensor.modbus_falownik_energia_pv_produkcja_dzisiaj, internal: true }
  - { platform: homeassistant, id: e_load, entity_id: sensor.modbus_falownik_energia_zuzycie_dom_dzisiaj, internal: true }
  - { platform: homeassistant, id: e_imp, entity_id: sensor.modbus_falownik_energia_siec_import_dzisiaj, internal: true }
  - { platform: homeassistant, id: e_exp, entity_id: sensor.modbus_falownik_energia_siec_export_dzisiaj, internal: true }
  # ---- woda ----
  - { platform: homeassistant, id: w_dzis, entity_id: sensor.miernikwody_zuzycie_wody_dzisiaj_m3, internal: true }
  - { platform: homeassistant, id: w_mies, entity_id: sensor.ZMIEN_woda_miesiac_m3, internal: true }

display:
  - platform: mipi_spi
    model: ST7796
    id: lcd
    cs_pin: GPIO15
    dc_pin: GPIO2
    reset_pin: GPIO4
    dimensions:
      width: 320
      height: 480
    # POZIOMO 480x320. Jak obraz będzie do góry nogami / lustrzany - zmieniaj mirror_x / mirror_y
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: true
    pixel_mode: 18bit
    color_order: bgr
    invert_colors: false
    update_interval: 300ms

    lambda: |-
      id(lcd_bl).turn_on();
      it.image(0, 0, id(tlo));

      auto white  = Color(255,255,255);
      auto unitc  = Color(232,238,245);
      auto muted  = Color(159,176,192);
      auto green  = Color(62,240,160);
      auto lgreen = Color(93,255,138);
      auto orange = Color(255,194,58);
      auto coral  = Color(255,138,106);
      auto dim    = Color(70,84,94);

      auto v = [](sensor::Sensor *s) -> float { float x = s->state; return isnan(x) ? 0.0f : x; };
      float p1 = v(id(pv1)), p2 = v(id(pv2)), pv = p1 + p2;
      float ld = v(id(load)), gr = v(id(grid)), bt = v(id(bat)), sc = v(id(soc));

      char b[40];
      // liczba + jednostka (jednostka mniejsza)
      auto val = [&](int x, int y, const char *num, const char *unit, font::Font *fn, Color c, bool right) {
        int x1, y1, w, h, wu = 0;
        it.get_text_bounds(0, 0, num, fn, TextAlign::BASELINE_LEFT, &x1, &y1, &w, &h);
        if (unit[0]) it.get_text_bounds(0, 0, unit, id(m10), TextAlign::BASELINE_LEFT, &x1, &y1, &wu, &h);
        int x0 = right ? x - w - wu - 3 : x;
        it.print(x0, y, fn, c, TextAlign::BASELINE_LEFT, num);
        if (unit[0]) it.print(x0 + w + 3, y, id(m10), unitc, TextAlign::BASELINE_LEFT, unit);
      };

      // ---------- godzina ----------
      auto now = id(ha_time).now();
      if (now.is_valid()) {
        now.strftime(b, sizeof(b), "DZISIAJ · %H:%M");
        it.print(471, 17, id(m10), muted, TextAlign::BASELINE_RIGHT, b);
      }

      // ---------- PV ----------
      sprintf(b, "%.2f", pv / 1000.0f);
      val(22, 116, b, "kW", id(b20), white, false);
      sprintf(b, "PV1 %.2f kW  ·  PV2 %.2f kW", p1 / 1000.0f, p2 / 1000.0f);
      it.print(24, 128, id(m10), unitc, TextAlign::BASELINE_LEFT, b);

      // ---------- DOM ----------
      sprintf(b, "%.2f", ld / 1000.0f);
      val(465, 107, b, "kW", id(b16), white, true);

      // ---------- WODA ----------
      float wd = id(w_dzis).state, wm = id(w_mies).state;
      if (isnan(wd)) sprintf(b, "--"); else sprintf(b, "%.2f", wd);
      val(362, 144, b, "m³", id(b11), white, false);
      if (isnan(wm)) sprintf(b, "--"); else sprintf(b, "%.2f", wm);
      val(417, 144, b, "m³", id(b11), white, false);

      // ---------- SIEĆ (dodatnia = import) ----------
      sprintf(b, "%.2f", fabsf(gr) / 1000.0f);
      val(74, 188, b, "kW", id(b16), gr > 20 ? coral : orange, false);
      it.print(75, 200, id(m10), unitc, TextAlign::BASELINE_LEFT,
               gr > 20 ? "IMPORT Z SIECI" : (gr < -20 ? "EKSPORT DO SIECI" : "BILANS ZERO"));

      // ---------- MAGAZYN (ujemna = ładowanie) ----------
      sprintf(b, "%.0f%%", sc);
      val(269, 191, b, "", id(b16), white, false);
      if (bt < -20) {
        it.print(270, 202, id(m10), unitc, TextAlign::BASELINE_LEFT, "ŁADOWANIE");
        sprintf(b, "+%.2f kW", -bt / 1000.0f);
        it.print(271, 214, id(b11), orange, TextAlign::BASELINE_LEFT, b);
      } else if (bt > 20) {
        it.print(270, 202, id(m10), unitc, TextAlign::BASELINE_LEFT, "ROZŁADOWANIE");
        sprintf(b, "-%.2f kW", bt / 1000.0f);
        it.print(271, 214, id(b11), coral, TextAlign::BASELINE_LEFT, b);
      } else {
        it.print(270, 202, id(m10), unitc, TextAlign::BASELINE_LEFT, "CZUWANIE");
      }

      // ---------- LICZNIKI DZISIAJ ----------
      auto cnt = [&](int x, sensor::Sensor *s, Color c) {
        float e = s->state;
        if (isnan(e)) sprintf(b, "--"); else sprintf(b, "%.1f", e);
        val(x, 276, b, "kWh", id(b14), c, false);
      };
      cnt(49,  id(e_pv),   green);
      cnt(167, id(e_load), white);
      cnt(285, id(e_imp),  orange);
      cnt(396, id(e_exp),  green);

      // ---------- STRZAŁKI (zapalają się po kolei) ----------
      int step = (millis() / 300) % 4;
      // jedna strzałka ">" w kierunku (dx,dy)
      auto chev = [&](int cx, int cy, int dx, int dy, Color c) {
        int px = -dy, py = dx;
        for (int o = -1; o <= 1; o++) {
          int sx = (dx != 0) ? o : 0, sy = (dy != 0) ? o : 0;
          it.line(cx - dx*3 + px*4 + sx, cy - dy*3 + py*4 + sy, cx + dx*3 + sx, cy + dy*3 + sy, c);
          it.line(cx - dx*3 - px*4 + sx, cy - dy*3 - py*4 + sy, cx + dx*3 + sx, cy + dy*3 + sy, c);
        }
      };
      // rząd 3 strzałek; dir: 1 = w stronę (dx,dy), -1 = odwrotnie, 0 = brak przepływu
      auto row = [&](int x0, int y0, int dx, int dy, int dir, Color on) {
        for (int i = 0; i < 3; i++) {
          int k = dir >= 0 ? i : 2 - i;
          bool lit = dir != 0 && (k == step || k == step - 1);
          int cx = x0 + dx * 7 * i, cy = y0 + dy * 7 * i;
          chev(cx, cy, dir < 0 ? -dx : dx, dir < 0 ? -dy : dy, lit ? on : dim);
        }
      };
      int th = 20;
      row(181, 110, 1, 0, pv > th ? 1 : 0, lgreen);                         // PV -> falownik
      row(271, 110, 1, 0, ld > th ? 1 : 0, lgreen);                         // falownik -> dom
      row(175, 173, -1, 0, gr < -th ? 1 : (gr > th ? -1 : 0), orange);      // falownik -> sieć (eksport)
      row(232, 141, 0, 1, bt < -th ? 1 : (bt > th ? -1 : 0), orange);       // falownik -> magazyn (ładowanie)
